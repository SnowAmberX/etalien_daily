name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Build headless CLI
        run: dart build cli -o build/headless -t bin/headless.dart

      - name: Prepare release directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/etalien-daily-windows-x64/config
          New-Item -ItemType Directory -Force release/etalien-daily-windows-x64/bin
          New-Item -ItemType Directory -Force release/etalien-daily-windows-x64/lib
          Copy-Item -Recurse build/windows/x64/runner/Release/* release/etalien-daily-windows-x64/
          Copy-Item build/headless/bundle/bin/headless.exe release/etalien-daily-windows-x64/bin/etalien_headless.exe
          Copy-Item build/headless/bundle/lib/sqlite3.dll release/etalien-daily-windows-x64/lib/sqlite3.dll

      - name: Archive release
        shell: pwsh
        run: |
          Compress-Archive -Path release/etalien-daily-windows-x64 -DestinationPath etalien-daily-windows-x64.zip -Force

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $content = Get-Content CHANGELOG.md -Raw
          if ($content -match "## \[$version\][^\n]*\n((?:(?!## \[).*\n?)*)") {
            $body = $matches[1].Trim()
            echo "changelog_body<<EOF" >> $env:GITHUB_OUTPUT
            echo "$body" >> $env:GITHUB_OUTPUT
            echo "EOF" >> $env:GITHUB_OUTPUT
          } else {
            echo "changelog_body=See CHANGELOG.md for details." >> $env:GITHUB_OUTPUT
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: etalien-daily-windows-x64.zip
          body: ${{ steps.changelog.outputs.changelog_body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
